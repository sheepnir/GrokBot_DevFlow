# Claude review workflow: the automatic first pass on pull requests written by Codex, so the first pass is never the family that wrote the change.
# Copy into .github/workflows/ of a product repository. Needs the CLAUDE_CODE_OAUTH_TOKEN repository secret, generated by the founder with `claude setup-token`.
# It posts inline comments and a summary. It never approves; the Code Reviewer's review is the gate.
# Posting goes through the Claude GitHub App, which `id-token: write` exchanges for, so the workflow token stays read-only (the permissions below match the documented review workflow).
# Same-repository branches only: a pull request from a fork gets no secrets, and the condition below skips it.
# The CTO applies the `pool:codex` label when it opens a pull request written on Codex; that label, not the PR text, starts this workflow.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]
jobs:
  review:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'pool:codex')
      && (github.event.action != 'labeled' || github.event.label.name == 'pool:codex')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
