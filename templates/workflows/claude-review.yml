# Claude review workflow: the automatic first pass on pull requests written by Codex, so the first pass is never the family that wrote the change.
# Copy into .github/workflows/ of a product repository. Needs the CLAUDE_CODE_OAUTH_TOKEN repository secret, generated by the founder with `claude setup-token`.
# It posts inline comments and a summary. It never approves; the Code Reviewer's review is the gate.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    if: contains(github.event.pull_request.body, 'via Codex')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
